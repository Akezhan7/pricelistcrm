version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: crm3_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-crm3_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-crm3_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm3_network

  # pgAdmin - веб-интерфейс для управления PostgreSQL (опционально)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crm3_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@crm3.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - crm3_network
    profiles:
      - admin # Запускается только с профилем: docker-compose --profile admin up

volumes:
  postgres_data:
    driver: local
    name: crm3_postgres_data
  pgadmin_data:
    driver: local
    name: crm3_pgadmin_data

networks:
  crm3_network:
    driver: bridge
    name: crm3_network

# ==========================================
# ИНСТРУКЦИИ ПО ИСПОЛЬЗОВАНИЮ
# ==========================================
#
# Все команды выполняются из папки server/
#
# 1. Базовый запуск (только PostgreSQL):
#    docker-compose up -d
#
# 2. Запуск с pgAdmin для администрирования:
#    docker-compose --profile admin up -d
#
# 3. Просмотр логов:
#    docker-compose logs -f postgres
#
# 4. Остановка:
#    docker-compose down
#
# 5. Остановка с удалением данных:
#    docker-compose down -v
#
# 6. Подключение к PostgreSQL из приложения:
#    Host: localhost
#    Port: 5432 (или значение DB_PORT из .env)
#    Database: crm3_db
#    User: postgres
#    Password: postgres (или значение DB_PASSWORD из .env)
#
# 7. Доступ к pgAdmin:
#    URL: http://localhost:5050
#    Email: admin@crm3.local
#    Password: admin
#
# 8. Резервное копирование базы данных:
#    docker-compose exec postgres pg_dump -U postgres crm3_db > backup.sql
#
# 9. Восстановление из резервной копии:
#    cat backup.sql | docker-compose exec -T postgres psql -U postgres crm3_db
#
# ==========================================
